# Single-binary Loki config — local filesystem storage, no clustering (#397). Appropriate for one
# app's log volume; revisit if this ever needs to scale beyond a single Loki instance.
#
# ${LOKI_RETENTION_DAYS} below is expanded from the environment at startup — the loki service in
# docker-compose.observability.yml passes -config.expand-env=true for this.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: ${LOKI_RETENTION_DAYS}d

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
