# Scrapes host metrics (node_exporter) and per-container metrics (cadvisor) for the "Host
# Overview" / "Container Resource Usage" Grafana dashboards (#397 follow-on to the Loki log
# dashboards). Retention is set via the --storage.tsdb.retention.time flag in
# docker-compose.observability.yml (PROMETHEUS_RETENTION_DAYS), not in this file — Prometheus,
# unlike Loki, doesn't expand env vars inside its own config.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
