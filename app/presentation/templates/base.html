<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DevOps Portal{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/tailwind.css?v=2">
    <style>
      /* Key-value editor for Ansible variable fields (ansible_vars_editor.js). Kept as a
         self-contained block so it doesn't depend on Tailwind's purged utility set. */
      .kv-tabs { display: flex; gap: .25rem; margin-bottom: .375rem; }
      .kv-tab { font-size: .75rem; padding: .125rem .5rem; border-radius: .25rem;
                border: 1px solid #374151; color: #9ca3af; background: transparent; cursor: pointer; }
      .kv-tab.kv-active { background: #374151; color: #e5e7eb; }
      .kv-rows { display: flex; flex-direction: column; gap: .375rem; }
      .kv-row { display: flex; gap: .375rem; align-items: center; }
      .kv-key, .kv-val { background: #1f2937; border: 1px solid #374151; border-radius: .25rem;
                padding: .375rem .5rem; color: #f3f4f6; font-size: .8125rem;
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace; min-width: 0; }
      .kv-key { width: 40%; }
      .kv-val { flex: 1; }
      .kv-key:focus, .kv-val:focus { outline: none; border-color: #16a34a; }
      .kv-remove { color: #f87171; background: transparent; border: none; cursor: pointer;
                font-size: 1rem; line-height: 1; padding: 0 .25rem; }
      .kv-remove:hover { color: #fca5a5; }
      .kv-add { margin-top: .375rem; font-size: .75rem; color: #34d399; background: transparent;
                border: none; cursor: pointer; padding: 0; }
      .kv-add:hover { color: #6ee7b7; }
      .kv-notice { margin-top: .375rem; font-size: .75rem; color: #fbbf24; }
      .kv-editor textarea.kv-raw { width: 100%; }
    </style>
    <script src="/static/js/htmx.min.js"></script>
    <script src="/static/js/htmx-sse.js"></script>
    <script src="/static/js/ansible_vars_editor.js"></script>
    <script>
      (function () {
        // Close any open <details> dropdown (⋮ row menu, ☰ nav) when clicking outside it.
        document.addEventListener('click', function (e) {
          document.querySelectorAll('details[open]').forEach(function (d) {
            if (!d.contains(e.target)) d.removeAttribute('open');
          });
        });
      })();
    </script>
</head>
<body class="h-full text-gray-100 font-mono">
    <header class="border-b border-gray-800 px-4 sm:px-6 py-4 flex items-center gap-3">
        <a href="/" class="text-green-400 text-lg font-bold hover:text-green-300 transition-colors">▶ DevOps Portal</a>
        {% if current_user %}
        <nav class="hidden md:flex items-center gap-1 ml-6 text-sm">
            <a href="/book/vm" class="px-3 py-1 rounded transition-colors {% if active_nav == 'vm' %}bg-gray-800 text-green-400{% else %}text-gray-500 hover:text-gray-300{% endif %}">Virtual Machines</a>
            <a href="/book/namespace" class="px-3 py-1 rounded transition-colors {% if active_nav == 'namespace' %}bg-gray-800 text-green-400{% else %}text-gray-500 hover:text-gray-300{% endif %}">Namespaces</a>
            <a href="/environments" class="px-3 py-1 rounded transition-colors {% if active_nav == 'environment' %}bg-gray-800 text-green-400{% else %}text-gray-500 hover:text-gray-300{% endif %}">Environments</a>
        </nav>
        <details class="relative ml-auto group">
            <summary class="list-none cursor-pointer px-2 py-1 rounded text-gray-400 hover:text-gray-200 hover:bg-gray-800 transition-colors select-none text-lg leading-none">☰</summary>
            <div class="absolute right-0 top-full mt-1 w-44 bg-gray-900 border border-gray-700 rounded shadow-lg z-50 py-1">
                <div class="md:hidden border-b border-gray-800 pb-1 mb-1">
                    <a href="/book/vm" class="block px-4 py-2 text-sm transition-colors {% if active_nav == 'vm' %}text-green-400{% else %}text-gray-300 hover:bg-gray-800{% endif %}">Virtual Machines</a>
                    <a href="/book/namespace" class="block px-4 py-2 text-sm transition-colors {% if active_nav == 'namespace' %}text-green-400{% else %}text-gray-300 hover:bg-gray-800{% endif %}">Namespaces</a>
                    <a href="/environments" class="block px-4 py-2 text-sm transition-colors {% if active_nav == 'environment' %}text-green-400{% else %}text-gray-300 hover:bg-gray-800{% endif %}">Environments</a>
                </div>
                <div class="px-4 py-2 text-xs text-gray-500 border-b border-gray-800">{{ current_user.username }}</div>
                {% if current_user.role == 'admin' %}
                <a href="/admin/users" class="block px-4 py-2 text-sm text-gray-300 hover:bg-gray-800 transition-colors">Users</a>
                <a href="/admin/catalog" class="block px-4 py-2 text-sm text-gray-300 hover:bg-gray-800 transition-colors">Catalog</a>
                {% endif %}
                <a href="/profile" class="block px-4 py-2 text-sm text-gray-300 hover:bg-gray-800 transition-colors">Profile</a>
                <div class="border-t border-gray-800 mt-1 pt-1">
                    <form method="post" action="/auth/logout">
                        <button type="submit" class="w-full text-left px-4 py-2 text-sm text-gray-300 hover:bg-gray-800 transition-colors">Sign out</button>
                    </form>
                </div>
            </div>
        </details>
        {% endif %}
    </header>

    <main class="max-w-5xl lg:max-w-6xl 2xl:max-w-7xl mx-auto px-4 sm:px-6 py-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
