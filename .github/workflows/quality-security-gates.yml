name: Quality and security gates

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: lint-and-format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Identify touched Python files
        id: touched-files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }} --depth=1 || true
            FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- '*.py' | tr '\n' ' ')
          else
            FILES=$(git diff --name-only HEAD~1...HEAD -- '*.py' 2>/dev/null | tr '\n' ' ' || true)
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Touched Python files: $FILES"

      - name: Check Ruff formatting and linting
        run: |
          FILES="${{ steps.touched-files.outputs.files }}"
          if [ -z "$FILES" ]; then
            echo "No Python files touched in this change. Skipping file-level check."
          else
            echo "Running ruff check on touched files: $FILES"
            ruff check $FILES
            echo "Running ruff format --check on touched files: $FILES"
            ruff format --check $FILES
          fi

  type-check:
    name: type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Mypy on domain and port contracts
        run: mypy app/domain/ app/application/ports.py --ignore-missing-imports

  security-sast:
    name: security-sast
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Bandit high-severity blocking gate
        run: bandit -r app/ --severity-level high --exclude tests/ -b .bandit-baseline.json -q

      - name: Generate Bandit medium-severity advisory report
        continue-on-error: true
        run: |
          echo "### Bandit Medium Severity Advisory Report" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          bandit -r app/ --severity-level medium --exclude tests/ -q 2>&1 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Run Gitleaks secret scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Audit declared Python requirements
        run: python scripts/audit_python.py

      - name: Audit locked frontend dependencies
        run: python scripts/audit_npm.py
