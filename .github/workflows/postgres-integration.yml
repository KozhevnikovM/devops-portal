name: PostgreSQL integration tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-integration:
    name: postgres-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal
          POSTGRES_DB: portal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal -d portal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      PYTHONPATH: src
      TEST_POSTGRES_URL: postgresql+asyncpg://portal:portal@127.0.0.1:5432/portal_test
      DATABASE_URL_SYNC: postgresql+psycopg2://portal:portal@127.0.0.1:5432/portal_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run PostgreSQL integration suite
        run: pytest tests/ -m postgres_integration --maxfail=1
