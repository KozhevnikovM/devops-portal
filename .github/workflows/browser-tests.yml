name: Browser tests

# Real-Chromium regression tests for the row action menus (#538, #542): the pages, base.html's
# script/stylesheet tags and the /static mount exactly as the app serves them. Required mode
# (REQUIRE_BROWSER_TESTS=1) turns any skip — Playwright or Chromium missing, app/static not
# built — into a failure, so this check can't pass without actually running the browser.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    name: browser-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-browser.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Build static assets
        run: npm ci && npm run build:static

      - name: Run browser test suite (required mode)
        env:
          REQUIRE_BROWSER_TESTS: "1"
        run: pytest tests/ -m browser
