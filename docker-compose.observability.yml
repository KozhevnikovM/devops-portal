# Optional observability overlay (#397, #396) — Grafana + Loki + Promtail dashboarding for the
# structured JSON logs the app/worker/beat processes already emit (see
# app/infrastructure/logging_config.py, #371). Not part of the default `docker compose up` — start
# it alongside the main compose file explicitly:
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up
#
# (swap in docker-compose.prod.yml for a production deployment; the overlay itself is identical
# either way). See "Log aggregation & dashboards (Grafana + Loki)" in docs/admin-guide.md.
#
# No application code depends on this — it only reads existing container stdout. Nothing about
# the app/worker/beat services changes when this overlay isn't used.

services:
  loki:
    image: ${LOKI_IMAGE:-grafana/loki:2.9.6}
    command: ["-config.file=/etc/loki/config.yml", "-config.expand-env=true"]
    environment:
      LOKI_RETENTION_DAYS: ${LOKI_RETENTION_DAYS:-14}
    volumes:
      - ./observability/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    restart: unless-stopped

  promtail:
    image: ${PROMTAIL_IMAGE:-grafana/promtail:2.9.6}
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.1.0}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      # Defaults to the portal's own ADMIN_PASSWORD (one password to remember for both), same
      # dev-mode "changeme" fallback as the portal's own seeded admin (app/main.py). Set
      # GF_SECURITY_ADMIN_PASSWORD explicitly to give Grafana a different password.
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-${ADMIN_PASSWORD:-changeme}}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Only needed for a reverse-proxy subpath deployment (e.g. https://host/grafana/) — see
      # "Running Grafana behind an HTTPS reverse proxy" in docs/admin-guide.md. Empty/unset =
      # Grafana serves at its own root, which is correct for the subdomain option (Option A).
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-}
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GF_SERVER_SERVE_FROM_SUB_PATH:-false}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  loki_data:
  grafana_data:
