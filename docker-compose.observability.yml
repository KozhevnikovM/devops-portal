# Optional observability overlay (#397, #396) — Grafana + Loki + Promtail dashboarding for the
# structured JSON logs the app/worker/beat processes already emit (see
# app/infrastructure/logging_config.py, #371), plus Prometheus + node_exporter + cadvisor for host
# and per-container resource metrics. Not part of the default `docker compose up` — start it
# alongside the main compose file explicitly:
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up
#
# (swap in docker-compose.prod.yml for a production deployment; the overlay itself is identical
# either way). See "Log aggregation & dashboards (Grafana + Loki)" in docs/admin-guide.md.
#
# No application code depends on this — it only reads existing container stdout. Nothing about
# the app/worker/beat services changes when this overlay isn't used.

services:
  loki:
    image: ${LOKI_IMAGE:-grafana/loki:2.9.6}
    command: ["-config.file=/etc/loki/config.yml", "-config.expand-env=true"]
    environment:
      LOKI_RETENTION_DAYS: ${LOKI_RETENTION_DAYS:-14}
    volumes:
      - ./observability/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    restart: unless-stopped

  promtail:
    image: ${PROMTAIL_IMAGE:-grafana/promtail:2.9.6}
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.1.0}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      # Defaults to the portal's own ADMIN_PASSWORD (one password to remember for both), same
      # dev-mode "changeme" fallback as the portal's own seeded admin (app/main.py). Set
      # GF_SECURITY_ADMIN_PASSWORD explicitly to give Grafana a different password.
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-${ADMIN_PASSWORD:-changeme}}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Only needed for a reverse-proxy subpath deployment (e.g. https://host/grafana/) — see
      # "Running Grafana behind an HTTPS reverse proxy" in docs/admin-guide.md. Empty/unset =
      # Grafana serves at its own root, which is correct for the subdomain option (Option A).
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-}
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GF_SERVER_SERVE_FROM_SUB_PATH:-false}
    volumes:
      # Dashboard JSONs live under provisioning/dashboards/json/ on the host (see
      # provisioning/dashboards/dashboards.yml's `path`), so this one mount covers datasources,
      # the dashboard provider config, and the dashboards themselves — no second, nested bind
      # mount inside this already-read-only tree (that previously failed to start: Docker can't
      # create a mountpoint inside a read-only parent bind mount).
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
      - prometheus
    restart: unless-stopped

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE:-prom/node-exporter:v1.8.2}
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: unless-stopped

  cadvisor:
    image: ${CADVISOR_IMAGE:-gcr.io/cadvisor/cadvisor:v0.52.1}
    command:
      - "-docker_only=true"
      # Docker Engine 28+ defaults to the containerd snapshotter storage backend, under which
      # cadvisor's classic Docker handler can't find a container's read-write layer (it looks for
      # a legacy /var/lib/docker/image/overlayfs/layerdb path that no longer gets populated) and
      # silently fails to report *any* per-container metrics — confirmed by actually running this
      # stack, not just reading cadvisor's docs. Disabling the Docker handler outright
      # (-docker=invalid://, an unparseable endpoint) forces every container through cadvisor's
      # containerd handler instead, which talks to containerd directly and isn't affected by the
      # storage-backend change; leaving the Docker handler enabled at the same time was observed
      # to race with it non-deterministically (worked sometimes, silently returned zero
      # containers other times) rather than reliably falling back. -containerd-namespace must be
      # "moby" (Docker's own containerd namespace), not cadvisor's k8s-oriented default of
      # "k8s.io". Requires cadvisor v0.52+ — v0.49 (this repo's original pin) doesn't have working
      # containerd-fallback support at all.
      - "-docker=invalid://"
      - "-containerd=/run/containerd/containerd.sock"
      - "-containerd-namespace=moby"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    restart: unless-stopped

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.54.1}
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_DAYS:-14}d"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - node-exporter
      - cadvisor
    restart: unless-stopped

volumes:
  loki_data:
  grafana_data:
  prometheus_data:
